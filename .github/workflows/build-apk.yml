name: Build APK (Android)

# Chạy thủ công: tab Actions -> "Build APK (Android)" -> "Run workflow"
# (hoặc CLI: gh workflow run build-apk.yml)
# Sau khi chạy xong: vào trang run -> mục "Artifacts" -> tải file APK.
on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # react-native 0.86 yêu cầu Node ^20.19.4 || ^22.13.0 || ^24.3.0 || >=25
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci --no-audit --no-fund

      - name: Sinh dự án Android (expo prebuild)
        env:
          CI: 1
        run: npx expo prebuild --platform android --no-install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # react-native 0.86 / Expo SDK 57: compileSdk=36, buildTools=36.0.0,
      # ndk=27.1.12297006 (các module Expo biên dịch C++ cần NDK + CMake).
      # LƯU Ý: setup-android@v3 tách danh sách "packages" theo DẤU CÁCH (không
      # tách theo xuống dòng) nên phải để TẤT CẢ trên MỘT dòng như dưới đây.
      # Nếu viết nhiều dòng (kiểu YAML "|"), sdkmanager sẽ nhận cả khối thành
      # 1 tên package -> "Failed to find package" + exit code 1.
      - name: Cài Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Đổi tên APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "kho-hang-hoa-don-debug-$(date +%Y%m%d-%H%M).apk"
          ls -lh kho-hang-hoa-don-debug-*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kho-hang-apk
          path: kho-hang-hoa-don-debug-*.apk
          retention-days: 30
